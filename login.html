<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImpactSetu - Authentication</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 380px;
      margin: 60px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0 16px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .btn-primary { background-color: #007bff; color: white; }
    .btn-secondary { background-color: #6c757d; color: white; }
    .btn-google { background-color: #4285F4; color: white; width: 100%; }
    .btn-danger { background-color: #dc3545; color: white; width: 100%; }
    #status {
      margin-top: 15px;
      font-weight: bold;
      word-break: break-word;
    }
  </style>
</head>
<body>

  <h2>Account Authentication</h2>

  <!-- Login/Signup Form -->
  <div id="auth-form">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="name@example.com">

    <label>Password</label>
    <input type="password" id="password" placeholder="At least 6 characters">

    <div class="btn-group">
      <button id="signup-btn" class="btn-primary">Sign Up</button>
      <button id="login-btn" class="btn-secondary">Log In</button>
    </div>

    <button id="google-btn" class="btn-google">Sign in with Google</button>
  </div>

  <!-- Logout Button -->
  <button id="logout-btn" class="btn-danger" style="display: none;">Log Out</button>

  <div id="status">Checking status...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Your exact Firebase project configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBlzSgH-v2CD5n8AOkp9tQ_f8_J7kjfwk4",
      authDomain: "impactsetu-mpb3.firebaseapp.com",
      projectId: "impactsetu-mpb3",
      storageBucket: "impactsetu-mpb3.firebasestorage.app",
      messagingSenderId: "211603319333",
      appId: "1:211603319333:web:07c7894790c34cf446adcc",
      measurementId: "G-4P9HK2NZLR"
    };

    // Initialize Firebase and Authentication
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const googleProvider = new GoogleAuthProvider();

    // UI Elements
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const signupBtn = document.getElementById('signup-btn');
    const loginBtn = document.getElementById('login-btn');
    const googleBtn = document.getElementById('google-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const authForm = document.getElementById('auth-form');
    const statusText = document.getElementById('status');

    // Email Registration
    signupBtn.addEventListener('click', () => {
      statusText.textContent = "Creating account...";
      createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => statusText.textContent = "Account created successfully!")
        .catch(error => statusText.textContent = "Error: " + error.message);
    });

    // Email Login
    loginBtn.addEventListener('click', () => {
      statusText.textContent = "Logging in...";
      signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value)
        .then(() => statusText.textContent = "Logged in!")
        .catch(error => statusText.textContent = "Error: " + error.message);
    });

    // Google Login
    googleBtn.addEventListener('click', () => {
      statusText.textContent = "Opening Google login...";
      signInWithPopup(auth, googleProvider)
        .then(() => statusText.textContent = "Google Sign-In successful!")
        .catch(error => statusText.textContent = "Error: " + error.message);
    });

    // Logout
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => statusText.textContent = "Logged out successfully.");
    });

    // Authentication State Listener
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authForm.style.display = 'none';
        logoutBtn.style.display = 'block';
        statusText.textContent = "Logged in as: " + (user.email || user.displayName);
      } else {
        authForm.style.display = 'block';
        logoutBtn.style.display = 'none';
        statusText.textContent = "Please log in or sign up.";
      }
    });
  </script>

</body>
</html>
